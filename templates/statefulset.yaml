apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "genomicsdb.fullname" . }}
  labels:
    {{- include "genomicsdb.labels" . | nindent 4 }}
    type: dbms
spec:
  serviceName: {{ include "genomicsdb.fullname" . }}
  selector:
    matchLabels:
      {{- include "genomicsdb.selectorLabels" . | nindent 6 }}
      type: dbms
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "genomicsdb.selectorLabels" . | nindent 8 }}
        type: dbms
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-postgres
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: POSTGRES_USER
            value: {{ .Values.adminuser }}
          {{- if .Values.dbMigration }}
          - name: OLDHOST
            value: {{ .Values.dbMigration.host | quote }}
          - name: MIGRATE_DATABASE
            value: {{ .Values.dbMigration.database | quote }}
          {{- end }}
          envFrom:
            - secretRef:
                name: "{{ include "genomicsdb.fullname" . }}-password"
          ports:
            - name: postgres-port
              containerPort: 5432
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- tpl (omit .Values.livenessProbe "enabled" | toYaml) . | nindent 12 }}
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.adminuser | quote }}
                - -h
                - localhost
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          - mountPath: /var/lib/postgresql
            name: postgres-data
          {{- if .Values.shmSize }}
          - mountPath: /dev/shm
            name: dshm
          {{- end }}
          {{- if .Values.postgresqlConf }}
          - mountPath: /usr/share/postgresql/postgresql.conf.sample
            subPath: postgresql.conf.sample
            name: postgresql-conf
          {{- end }}
          {{- if .Values.dbMigration }}
          - mountPath: /docker-entrypoint-initdb.d/
            name: initdb-script
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.shmSize .Values.postgresqlConf }}
      volumes:
        {{- if .Values.shmSize }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        {{- end }}
        {{- if .Values.dbMigration }}
        - name: initdb-script
          configMap:
            name: "{{- include "genomicsdb.fullname" . }}-migrate"
        {{- end }}
        {{- if .Values.postgresqlConf }}
        - name: postgresql-conf
          configMap:
            name: "{{- include "genomicsdb.fullname" . }}-pg-conf"
        {{- end }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.dbStorageSize }}
